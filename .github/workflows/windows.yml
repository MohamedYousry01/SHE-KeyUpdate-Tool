name: Windows checks and releases
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Build and test
        run: python scripts/build.py
      - name: Smoke test the frozen CLI
        run: |
          downloads/she-key.exe generate examples/demo-input.json --output build/smoke.json
          python -c "import json; d=json.load(open('build/smoke.json')); assert d['messages']['M3']=='B9D745E5ACE7D41860BC63C2B9F5BB46'"
      - uses: actions/upload-artifact@v4
        with:
          name: SHE-Key-Studio-Windows-x64
          path: |
            downloads/*.exe
            downloads/SHA256SUMS.txt
            release/*.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SHE-Key-Studio-Windows-x64
          path: assets
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/downloads/*.exe assets/downloads/SHA256SUMS.txt assets/release/*.zip --title "SHE Key Studio $GITHUB_REF_NAME" --generate-notes
