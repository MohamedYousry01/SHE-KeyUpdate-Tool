[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "she-key-studio"
version = "1.0.0"
description = "Offline SHE provisioning workbench for embedded developers"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Mohamed Yousry"}]
dependencies = ["pycryptodome==3.23.0", "PySide6==6.11.2"]

[project.scripts]
she-key = "she_studio.console:main"

[project.gui-scripts]
she-key-studio = "she_studio.desktop:main"

[project.urls]
Portfolio = "https://mohamedyousry01.github.io/Mohamed-Yousry-Portfolio/"

[tool.setuptools.packages.find]
include = ["she_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
